<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 요청 승인</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #f5f7f8;
      --panel: #ffffff;
      --ink: #172126;
      --muted: #5d6b72;
      --line: #d5dde1;
      --accent: #087f6b;
      --accent-dark: #056454;
      --danger: #a33a32;
      --radius: 12px;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--surface);
      color: var(--ink);
    }
    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }
    header { margin-bottom: 28px; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 42px); letter-spacing: -0.04em; }
    header p { margin: 0; max-width: 62ch; color: var(--muted); line-height: 1.65; }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: clamp(20px, 5vw, 34px);
      box-shadow: 0 18px 46px rgba(34, 55, 63, 0.08);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 700; }
    input {
      width: 100%;
      border: 1px solid #aebbc1;
      border-radius: 8px;
      padding: 12px 13px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    input:focus-visible, button:focus-visible { outline: 3px solid rgba(8, 127, 107, 0.28); outline-offset: 2px; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    button {
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid transparent;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-dark); }
    .secondary { border-color: #9caab0; background: #fff; color: var(--ink); }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .risk {
      margin-top: 24px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8faf9;
    }
    .risk[hidden], .result[hidden] { display: none; }
    .risk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .risk h2 { margin: 0; font-size: 19px; }
    .level { font: 700 12px ui-monospace, Consolas, monospace; color: var(--danger); }
    .risk dl { display: grid; grid-template-columns: 92px 1fr; gap: 8px 14px; margin: 18px 0; }
    .risk dt { color: var(--muted); }
    .risk dd { margin: 0; overflow-wrap: anywhere; }
    .risk ul { margin: 0; padding-left: 20px; color: #35454c; line-height: 1.65; }
    .result {
      margin-top: 20px;
      border-left: 4px solid var(--accent);
      padding: 14px 16px;
      background: #edf7f4;
      overflow-wrap: anywhere;
    }
    .error { color: var(--danger); border-left-color: var(--danger); background: #fff2f0; }
    code { font: 12px/1.55 ui-monospace, Consolas, monospace; }
    @media (max-width: 640px) {
      main { padding: 28px 0; }
      .grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .actions { flex-direction: column; }
      button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Agent 요청 승인</h1>
    <p>실행 전에 행동, 대상, 위험을 확인하세요. 승인 토큰은 현재 요청 해시에만 결합되며 5분 후 만료되고 한 번만 사용할 수 있습니다.</p>
  </header>

  <section class="panel" aria-labelledby="request-title">
    <h2 id="request-title" style="margin-top:0">승인할 요청</h2>
    <div class="grid">
      <div class="field full">
        <label for="requestHash">요청 해시</label>
        <input id="requestHash" autocomplete="off" required>
      </div>
      <div class="field full">
        <label for="actorDid">Agent DID</label>
        <input id="actorDid" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="action">행동</label>
        <input id="action" placeholder="external_send" required>
      </div>
      <div class="field">
        <label for="target">대상</label>
        <input id="target" placeholder="recipient@example.com" required>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="assessButton" type="button">위험 확인</button>
      <button class="secondary" id="clearButton" type="button">초기화</button>
    </div>

    <section class="risk" id="riskPanel" hidden aria-live="polite">
      <div class="risk-head">
        <h2>승인 전 확인</h2>
        <span class="level" id="riskLevel"></span>
      </div>
      <dl>
        <dt>행동</dt><dd id="riskAction"></dd>
        <dt>대상</dt><dd id="riskTarget"></dd>
        <dt>정책 결과</dt><dd id="riskOutcome"></dd>
      </dl>
      <ul id="riskList"></ul>
      <div class="actions">
        <button class="primary" id="approveButton" type="button">위 내용을 확인하고 승인</button>
        <button class="secondary" id="denyButton" type="button">거부</button>
      </div>
    </section>
    <div class="result" id="result" hidden aria-live="assertive"></div>
  </section>
</main>
<script>
  const ids = ["requestHash", "actorDid", "action", "target"];
  const value = id => document.getElementById(id).value.trim();
  const payload = approved => ({
    requestHash: value("requestHash"), actorDid: value("actorDid"),
    action: value("action"), target: value("target"), approved
  });
  const result = document.getElementById("result");
  const riskPanel = document.getElementById("riskPanel");

  function showMessage(text, error = false) {
    result.hidden = false;
    result.classList.toggle("error", error);
    result.textContent = text;
  }

  function validate() {
    const missing = ids.find(id => !value(id));
    if (!missing) return true;
    document.getElementById(missing).focus();
    showMessage("모든 요청 정보를 입력해야 합니다.", true);
    return false;
  }

  document.getElementById("assessButton").addEventListener("click", async () => {
    if (!validate()) return;
    result.hidden = true;
    try {
      const response = await fetch("/approvals/assess", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload(false))
      });
      if (!response.ok) throw new Error("위험 평가 요청이 거부되었습니다.");
      const assessment = await response.json();
      document.getElementById("riskLevel").textContent = `위험 ${assessment.level}`;
      document.getElementById("riskAction").textContent = assessment.actionSummary;
      document.getElementById("riskTarget").textContent = assessment.target;
      document.getElementById("riskOutcome").textContent = assessment.recommendedOutcome;
      const list = document.getElementById("riskList");
      list.replaceChildren(...assessment.risks.map(risk => {
        const item = document.createElement("li"); item.textContent = risk; return item;
      }));
      riskPanel.hidden = false;
      document.getElementById("approveButton").focus();
    } catch (error) { showMessage(error.message, true); }
  });

  document.getElementById("approveButton").addEventListener("click", async () => {
    const button = document.getElementById("approveButton");
    button.disabled = true; button.textContent = "승인 토큰 발급 중";
    try {
      const response = await fetch("/approvals/issue", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload(true))
      });
      if (!response.ok) throw new Error("승인 토큰 발급에 실패했습니다.");
      const token = await response.json();
      showMessage(`승인 완료. tokenId: ${token.tokenId} / 만료: ${token.expiresAt}`);
      riskPanel.hidden = true;
    } catch (error) { showMessage(error.message, true); }
    finally { button.disabled = false; button.textContent = "위 내용을 확인하고 승인"; }
  });

  document.getElementById("denyButton").addEventListener("click", () => {
    riskPanel.hidden = true; showMessage("요청을 승인하지 않았습니다.", true);
  });
  document.getElementById("clearButton").addEventListener("click", () => {
    ids.forEach(id => document.getElementById(id).value = "");
    riskPanel.hidden = true; result.hidden = true; document.getElementById("requestHash").focus();
  });
</script>
</body>
</html>
