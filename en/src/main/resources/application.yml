server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8000}
  shutdown: graceful

spring:
  application:
    name: agent-security-mcp
  lifecycle:
    timeout-per-shutdown-phase: 20s
  ai:
    mcp:
      server:
        name: agent-security-mcp
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

security:
  opa:
    url: ${OPA_URL:http://127.0.0.1:8181}
    timeout: 2s
  delegation:
    audience: agent-security-mcp
    max-depth: 3
    # Register the user DID that issues the root delegation before running.
    trusted-issuers: []
  approval:
    token-ttl: 2m
    # Register trusted approval signer DIDs; an empty list rejects every high-risk request.
    trusted-approvers: []
